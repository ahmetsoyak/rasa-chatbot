# ============================================================================
# Eco-Travel Advisor — Rasa Open Source NLU + Core config
# ============================================================================
# Follows the brief: DIETClassifier on a spaCy tokeniser + featurisers,
# chosen for accuracy vs. CPU latency. A current Rasa 3-compatible
# DistilBERT variant is sketched (commented) below the DIET block.
# ============================================================================

recipe: default.v1
assistant_id: eco_travel_advisor
language: en

pipeline:
  # --- Tokenisation + dense features (spaCy, as the brief specifies) -------
  # en_core_web_md: 300-d word vectors, small enough for CPU hosting on
  # Hugging Face Spaces. Install: python -m spacy download en_core_web_md
  - name: SpacyNLP
    model: "en_core_web_md"
    case_sensitive: false
  - name: SpacyTokenizer
  - name: SpacyFeaturizer
    pooling: mean

  # --- Sparse / rule-based features ----------------------------------------
  - name: RegexFeaturizer
    # Uses the `regex: budget` patterns and the destination/origin lookup
    # tables in nlu.yml as extra features for DIET's entity tagger.
    use_lookup_tables: true
    use_regexes: true
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: word
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # --- Joint intent classification + entity extraction --------------------
  - name: DIETClassifier
    epochs: 100
    entity_recognition: true
    constrain_similarities: true
    model_confidence: softmax
    drop_rate: 0.25
    # Tuned with 5-fold cross-validation (see tests/README.md and the report):
    # the earlier whitespace-only pipeline at 60 epochs reached intent F1 0.75
    # and entity recall 0.48.

  # OPTIONAL UPGRADE (not enabled): DistilBERT dense features instead of
  # spaCy vectors, only if CPU inference stays well under 3 s:
  # - name: LanguageModelFeaturizer
  #   model_name: "distilbert"
  #   model_weights: "distilbert-base-uncased"

  - name: EntitySynonymMapper

  # --- Confidence-based fallback ------------------------------------------
  - name: FallbackClassifier
    threshold: 0.55
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
    core_fallback_threshold: 0.4
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
