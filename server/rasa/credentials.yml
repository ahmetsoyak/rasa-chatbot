# ============================================================================
# Eco-Travel Advisor — credentials.yml
# ============================================================================

rest:
  # REST channel — simple request/response, used for quick testing via curl
  # or Postman, and as a fallback integration point.
  {}

socketio:
  # Socket.IO channel — used by the React frontend for a persistent,
  # low-latency, bidirectional connection.
  user_message_evt: "user_uttered"
  bot_message_evt: "bot_uttered"
  session_persistence: true

# Uncomment to also expose a hosted webchat widget (e.g. for demoing without
# the custom React frontend):
#
# rasa_addons.core.channels.webchat.WebchatInput:
#   session_persistence: true
#   base_url: "http://localhost:5005"

# action_endpoint config lives in endpoints.yml, not here.
