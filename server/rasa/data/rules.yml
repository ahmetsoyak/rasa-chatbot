version: "3.1"

# ============================================================================
# Fallback / escalation design
# ----------------------------------------------------------------------------
# The custom action `action_default_fallback` overrides Rasa's built-in one,
# so config.yml (FallbackClassifier + RulePolicy.core_fallback_action_name)
# and this file use the standard name. Inside the action:
#   1st consecutive unclear turn -> "Did you mean...?" buttons built from the
#                                   model's top intent guesses (clarification 1)
#   2nd consecutive unclear turn -> constrained menu, utter_ask_rephrase
#                                   (clarification 2)
#   3rd consecutive unclear turn -> consent request; context is shared only
#                                   after the user explicitly confirms.
# Each unclear user message is reverted (UserUtteranceReverted) so it does not
# distort the dialogue history the policies see.
# ============================================================================

rules:
  - rule: Say greet whenever the user greets us
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Respond to bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Explain privacy handling
    steps:
      - intent: ask_privacy
      - action: utter_privacy

  - rule: Say goodbye whenever the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Thank the user
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - rule: Handle out of scope messages
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: Two-stage clarification on low NLU confidence
    steps:
      - intent: nlu_fallback
      - action: action_default_fallback

  - rule: Escalate to a human advisor on explicit request
    steps:
      - intent: request_human_advisor
      - action: utter_handover_notice
      - action: action_human_handover

  - rule: Record consent and send the advisor handover
    steps:
      - intent: confirm_handover
      - action: action_record_handover_consent
      - action: action_human_handover

  - rule: Respect refusal of advisor handover
    steps:
      - intent: decline_handover
      - action: action_record_handover_consent

  # --- Location (manual input or browser GPS) ------------------------------
  - rule: Set origin from typed city
    steps:
      - intent: inform_origin
      - action: action_set_location

  - rule: Set origin from GPS
    steps:
      - intent: share_location
      - action: action_set_location

  # --- Trip intake form -----------------------------------------------------
  - rule: Activate trip planning form
    steps:
      - intent: request_trip_planning
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Naming a destination starts trip planning
    condition:
      - active_loop: null
    steps:
      - intent: inform_destination
      - action: action_set_destination
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Submit trip planning form
    condition:
      - active_loop: trip_planning_form
    steps:
      - action: trip_planning_form
      - active_loop: null
      - action: utter_trip_summary
      - action: action_search_accommodations
      - action: action_calculate_carbon_footprint
      - action: action_search_transport
      - action: action_rank_recommendations

  # --- Questions asked in the middle of the form ----------------------------
  # Answer, then return to the form, which re-asks the pending slot. The
  # from_text slot mappings list these intents under not_intent so the
  # question is not stored as an answer.
  - rule: Interruption in the trip form, ask_carbon_footprint
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_carbon_footprint
      - action: action_calculate_carbon_footprint
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_carbon_offset
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_carbon_offset
      - action: action_carbon_offset_info
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_weather
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_weather
      - action: action_get_weather
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_accommodation_options
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_accommodation_options
      - action: action_search_accommodations
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_transport_options
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_transport_options
      - action: action_search_transport
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_cultural_experiences
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_cultural_experiences
      - action: action_search_cultural_experiences
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, inform_origin
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: inform_origin
      - action: action_set_location
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, share_location
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: share_location
      - action: action_set_location
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, ask_privacy
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: ask_privacy
      - action: utter_privacy
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, bot_challenge
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: bot_challenge
      - action: utter_iamabot
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, out_of_scope
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Interruption in the trip form, greet
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: greet
      - action: utter_greet
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - rule: Hand over to a human in the middle of the form
    condition:
      - active_loop: trip_planning_form
    steps:
      - intent: request_human_advisor
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_handover_notice
      - action: action_human_handover

  # --- Direct questions -------------------------------------------------------
  - rule: Answer direct carbon footprint questions
    steps:
      - intent: ask_carbon_footprint
      - action: action_calculate_carbon_footprint

  - rule: Answer direct accommodation questions
    steps:
      - intent: ask_accommodation_options
      - action: action_search_accommodations

  - rule: Answer direct transport questions
    steps:
      - intent: ask_transport_options
      - action: action_search_transport

  - rule: Answer direct cultural experience questions
    steps:
      - intent: ask_cultural_experiences
      - action: action_search_cultural_experiences

  - rule: Answer carbon offset questions
    steps:
      - intent: ask_carbon_offset
      - action: action_carbon_offset_info

  - rule: Answer weather questions
    steps:
      - intent: ask_weather
      - action: action_get_weather

  - rule: Re-rank when the user changes sustainability preference outside the form
    condition:
      - active_loop: null
    steps:
      - intent: inform_sustainability_preference
      - action: action_update_sustainability_level
      - action: action_search_accommodations
      - action: action_rank_recommendations
