pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  # Writable locations for the non-root Hugging Face user.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 7860;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The chat UI only needs the REST channel. Everything else on the Rasa
    # server (model upload, conversation trackers, status) stays private.
    location = /rasa/webhooks/rest/webhook {
      limit_except POST { deny all; }
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:5005/webhooks/rest/webhook;
      proxy_read_timeout 60s;
    }

    location /rasa/ {
      return 404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
