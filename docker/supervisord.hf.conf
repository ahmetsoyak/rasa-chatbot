[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:rasa]
directory=/app/server
command=python -m rasa run --credentials rasa/credentials.yml --endpoints rasa/endpoints.yml --enable-api --cors * --port 5005 -m models/eco-travel.tar.gz
autorestart=true
priority=10

[program:actions]
directory=/app/server
command=python -m rasa_sdk --actions actions --port 5055
autorestart=true
priority=20

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=30
