; Started directly (`supervisord -c` this file) rather than through Debian's
; /etc/supervisor/supervisord.conf, which needs root-owned /var/run and
; /var/log paths that the Hugging Face user (uid 1000) cannot write.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Program output goes to the container log (the Space's "Logs" tab).
[program:rasa]
directory=/app/server
command=python -m rasa run --credentials rasa/credentials.yml --endpoints rasa/endpoints.yml --port 5005 -m models/eco-travel.tar.gz
autorestart=true
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:actions]
directory=/app/server
command=python -m rasa_sdk --actions actions --port 5055
autorestart=true
priority=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
